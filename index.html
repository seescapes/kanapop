<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KanaPop</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/game.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <h1 class="brand-title">KanaPop</h1>
      <div class="header-actions">
        <button id="btn-toggle-sfx" class="btn-icon-tag" title="Sound effects">SFX</button>
        <button id="btn-toggle-voice" class="btn-icon-tag" title="Voice">Voice</button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs" role="tablist">
      <button class="nav-tab-btn active" data-tab="tab-flashcards" role="tab" aria-selected="true">Cards</button>
      <button class="nav-tab-btn" data-tab="tab-game" role="tab" aria-selected="false">Bubble Pop</button>
    </nav>

    <!-- ==========================================
         TAB 1: FLASHCARDS
         ========================================== -->
    <main id="tab-flashcards" class="tab-content active" role="tabpanel">
      <!-- Filter Panel -->
      <section class="fc-filter-panel">
        <div id="fc-type-selector" class="type-segmented-control">
          <label>
            <input type="radio" name="kana-type" value="hiragana" checked>
            <span>あ Hiragana</span>
          </label>
          <label>
            <input type="radio" name="kana-type" value="katakana">
            <span>ア Katakana</span>
          </label>
          <label>
            <input type="radio" name="kana-type" value="mixed">
            <span>Mixed</span>
          </label>
        </div>

        <div class="filter-row-container">
          <select id="fc-row-select" class="select-custom" aria-label="Row"></select>
          <span id="fc-counter" class="fc-counter">1 / 46</span>
        </div>
      </section>

      <!-- Status Bar -->
      <div class="progress-track">
        <div id="fc-progress-bar" class="progress-fill"></div>
      </div>

      <!-- 3D Flip Card -->
      <div class="flashcard-stage">
      <div id="fc-done" class="fc-done hidden">
        <div class="fc-done-title">Done</div>
        <button id="fc-restart" class="btn-ctrl btn-ctrl-primary">Again</button>
      </div>
      <div id="flashcard-scene" class="flashcard-scene">
        <div class="swipe-hint swipe-hint-again">✗</div>
        <div class="swipe-hint swipe-hint-know">✓</div>
        <div id="flashcard" class="flashcard-inner">
          <!-- FRONT FACE -->
          <div class="card-face card-face-front">
            <div class="card-top-bar">
              <button id="fc-mastered" class="btn-mastered-toggle no-flip" title="Mark as learned">☆</button>
              <button id="fc-audio" class="card-audio-btn no-flip" title="Play sound (P)">🔊</button>
            </div>
            <div class="card-main-content">
              <div id="fc-front-char" class="kana-large">あ</div>
            </div>
            <div class="card-bottom-bar"></div>
          </div>

          <!-- BACK FACE -->
          <div class="card-face card-face-back">
            <div class="card-top-bar"></div>
            <div class="card-main-content">
              <div id="fc-back-romaji" class="romaji-large">a</div>
              <div id="fc-back-alt" class="kana-alt-char">ア</div>
            </div>
            <div class="card-bottom-bar"></div>
          </div>
        </div>
      </div>
      </div>

      <!-- Controls -->
      <div class="fc-controls">
        <button id="fc-again" class="btn-ctrl btn-again" title="Don't know (←)">✗</button>
        <button id="fc-flip" class="btn-ctrl btn-ctrl-primary" title="Flip (Space)">Flip</button>
        <button id="fc-know" class="btn-ctrl btn-know" title="Know it (→)">✓</button>
        <button id="fc-shuffle" class="btn-ctrl" title="Shuffle">Shuffle</button>
      </div>
    </main>

    <!-- ==========================================
         TAB 2: BUBBLE POP GAME
         ========================================== -->
    <main id="tab-game" class="tab-content" role="tabpanel">
      <!-- HUD Bar -->
      <div class="game-hud">
        <div class="hud-stat">
          <span class="hud-label">Score</span>
          <span id="game-score" class="hud-val">0</span>
        </div>

        <div id="combo-badge" class="combo-badge hidden">
          <span id="combo-count">0x</span>
        </div>

        <div class="hud-stat hud-hp">
          <span class="hud-label">HP <span id="hp-text" class="hp-text">3 / 3</span></span>
          <div id="hearts-container" class="hp-bar"></div>
        </div>

        <div class="hud-stat" style="text-align: right;">
          <span class="hud-label">Best</span>
          <span id="game-highscore" class="hud-val">0</span>
        </div>
      </div>

      <!-- Target Banner -->
      <div class="target-banner">
        <span id="target-romaji" class="target-romaji">–</span>
        <button id="btn-replay-voice" class="btn-replay-voice" title="Replay sound">🔊</button>
      </div>

      <!-- Game Arena Container -->
      <div id="game-arena" class="game-arena">
        <!-- Start Game Overlay -->
        <div id="game-start-overlay" class="game-overlay">
          <h2 class="overlay-title">Bubble Pop</h2>

          <div class="game-settings-box">
            <select id="game-type-select" class="select-custom" aria-label="Kana set">
              <option value="hiragana">あ Hiragana</option>
              <option value="katakana">ア Katakana</option>
              <option value="mixed">あ + ア Mixed</option>
            </select>
            <select id="game-row-select" class="select-custom" aria-label="Row"></select>
          </div>

          <button id="btn-start-game" class="btn-game-primary">Start</button>
        </div>

        <!-- Game Over Modal -->
        <div id="game-over-modal" class="game-overlay hidden">
          <h2 class="overlay-title">Game Over</h2>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Score</div>
              <div id="final-score" class="stat-value">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Best</div>
              <div id="final-highscore" class="stat-value">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Accuracy</div>
              <div id="final-accuracy" class="stat-value">0%</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Max combo</div>
              <div id="final-max-combo" class="stat-value">0x</div>
            </div>
          </div>

          <div class="missed-section">
            <div class="missed-title">Review</div>
            <div id="missed-review-list" class="missed-list"></div>
          </div>

          <button id="btn-restart-game" class="btn-game-primary">Play again</button>
        </div>
      </div>

      <!-- In-game footer controls -->
      <div class="game-bottom-bar">
        <button id="btn-pause-game" class="btn-pause">Pause</button>
      </div>
    </main>
  </div>

  <!-- App Script Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
